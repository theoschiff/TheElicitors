# Model arguments
model_name_or_path: Qwen/Qwen3-1.7B
model_revision: main
torch_dtype: bfloat16
attn_implementation: flash_attention_2
fp16: false
bf16: true

tf32: false
# set in the terminal before training:
# export HF_USERNAME=your_hf_username 
# output_dir: /scratch/${HF_USERNAME}/google/gemma-3-1b-it/poetry
output_dir: /scratch/barghorn/Qwen/Qwen3-1.7B/Qwen-poetry-logprob-no-norm-v4
# output_dir: /scratch/izar/bordier/Qwen/Qwen3-1.7B/Qwen-math-no_normalization

# Dataset arguments
# dataset_id_or_path: Jeremmmyyyyy/Math #For math task
task_type : poetry
dataset_id_or_path: schifferlearning/Poetry-Categorized #For poetry task 
normalization: min-max

# Training arguments
# num_train_epochs: 2
# per_device_train_batch_size: 8
num_train_epochs: 5
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-7 # 1.0e-6 as in the deepseek math paper 5-e7 from https://hijkzzz.notion.site/unraveling-rlhf-and-its-variants-engineering-insights#147d9a33ecc9806090f3d5c749d31f05
lr_scheduler_type: cosine
warmup_ratio: 0.03
# GRPO specific parameters
beta: 0.001 # 0.04 as in the deepseek math paper 0.001 from https://hijkzzz.notion.site/unraveling-rlhf-and-its-variants-engineering-insights#147d9a33ecc9806090f3d5c749d31f05

max_prompt_length: 256
max_completion_length: 1024
num_generations: 4

use_vllm: true
vllm_gpu_memory_utilization: 0.9
resume_from_checkpoint: false

# Logging arguments
logging_strategy: steps
logging_steps: 1
report_to:
- wandb
- tensorboard
save_strategy: "steps"
save_steps: 25
seed: 42

# Hugging Face Hub 
push_to_hub: true
hub_strategy: every_save